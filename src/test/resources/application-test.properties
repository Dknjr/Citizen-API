# Profil de test : base H2 en mémoire et valeurs factices, pour que l'application
# démarre en CI sans MySQL, sans serveur mail et sans Google Cloud.
spring.datasource.url=jdbc:h2:mem:citizen;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
logging.level.org.springframework=WARN

# Clé factice réservée aux tests (32 octets de zéros encodés en Base64)
jwt.secret=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=

email.host=localhost
email.port=2525
