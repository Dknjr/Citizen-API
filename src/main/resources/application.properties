spring.application.name=Citizen
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration

server.port=2030

# Log level configuration
logging.level.root=ERROR
logging.level.com.openclassrooms=INFO
logging.level.org.springframework.boot.autoconfigure=INFO
logging.level.org.springframework.boot.web.embedded.tomcat=INFO
logging.level.org.springframework=DEBUG

# MySQL Database Configuration
# Toutes les valeurs sensibles viennent de variables d'environnement (voir le README).
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/managment-db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect


# Spring Boot Mail properties
spring.mail.host=${email.host}
spring.mail.port=${email.port}
spring.mail.username=${email.username}
spring.mail.password=${email.password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

email.username=${EMAIL_USERNAME:}
email.password=${EMAIL_PASSWORD:}
email.host=${EMAIL_HOST:smtp.gmail.com}
email.port=${EMAIL_PORT:587}
smtp.from.email=${SMTP_FROM_EMAIL:}

# Stockage des photos (preuves) : clé de compte de service encodée en Base64
google.cloud.project-id=${GCP_PROJECT_ID:}
google.cloud.bucket-name=${GCP_BUCKET_NAME:}
google.application.credentials=${GCP_CREDENTIALS_BASE64:}

# Signature des jetons JWT (obligatoire) : chaîne Base64 d'au moins 32 octets
jwt.secret=${JWT_SECRET}

# Compte administrateur créé au premier démarrage (optionnel)
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

